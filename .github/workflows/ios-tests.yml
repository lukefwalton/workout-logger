name: iOS Tests

# Builds the app + widget extension and runs the Swift unit suite on a macOS
# runner. The Xcode project is generated from project.yml by XcodeGen, and the
# build links the vendored lfwdesignsystem Swift Package at the repo root.
#
# Two jobs, deliberately on different runners:
#   - unit-tests (macos-14): the shipping-floor build + test run.
#   - foundation-models-guard (macos-26): proves the
#     `#if canImport(FoundationModels)` branch actually compiles. On any
#     toolchain without that SDK the app still builds green using only the
#     deterministic fallback, so without this job the FM parser could silently
#     drop out of CI coverage.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Swift unit tests
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Toolchain + sims
        run: |
          set -euo pipefail
          echo "::group::xcodebuild version"
          xcodebuild -version
          echo "::endgroup::"
          echo "::group::available iPhone simulators"
          xcrun simctl list devices available | grep -E "iPhone|iOS " || true
          echo "::endgroup::"
          echo "::group::vendored Swift package"
          ls -la lfwdesignsystem
          echo "::endgroup::"

      # Build first, test second: a compile error fails here with the real
      # swiftc error in this step's log instead of buried inside a combined
      # `xcodebuild test` that also does simulator boot + install.
      #
      # EXCLUDED_ARCHS=x86_64: macos-14 runners are Apple Silicon and the iOS
      # Simulator runs as arm64, so the x86_64 slice is never needed here.
      # SWIFT_ACTIVE_COMPILATION_CONDITIONS adds the `CI` compile flag so
      # `#if CI` test gates fire on the runner (the Simulator process doesn't
      # inherit the host env, so a compile-time flag is the only reliable path).
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -scheme WorkoutChatLog \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_ARCHS=x86_64 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG CI"

      - name: Run unit tests
        run: |
          set -euo pipefail
          DEST='platform=iOS Simulator,name=iPhone 15'
          if ! xcrun simctl list devices available | grep -q "iPhone 15 ("; then
            UDID=$(xcrun simctl list devices available --json \
              | python3 -c "import json,sys; r=json.load(sys.stdin)['devices']; ids=[d['udid'] for ds in r.values() for d in ds if d['name'].startswith('iPhone')]; print(ids[0] if ids else '')")
            if [ -z "$UDID" ]; then
              echo "::error::No iPhone simulator available on this runner"
              xcrun simctl list devices available
              exit 1
            fi
            DEST="id=$UDID"
          fi
          xcodebuild test-without-building \
            -scheme WorkoutChatLog \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO

  foundation-models-guard:
    name: Foundation Models compile guard
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The build alone can never prove the FM branch compiled: on a toolchain
      # without the SDK, `canImport` quietly selects the fallback and the build
      # stays green. This probe makes absence loud — it type-checks a file that
      # #errors unless FoundationModels is importable with this runner's iOS
      # simulator SDK. If GitHub's default Xcode on this image ever regresses
      # below the required SDK, this step (not a silent fallback) is what fails.
      - name: Assert FoundationModels is importable
        run: |
          set -euo pipefail
          xcodebuild -version
          cat > "$RUNNER_TEMP/fm_probe.swift" <<'SWIFT'
          #if canImport(FoundationModels)
          import FoundationModels
          #else
          #error("FoundationModels SDK missing from this toolchain — the on-device parser would silently compile out")
          #endif
          SWIFT
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iphonesimulator SDK: $SDK_VERSION at $SDK_PATH"
          xcrun swiftc -typecheck \
            -sdk "$SDK_PATH" \
            -target "arm64-apple-ios${SDK_VERSION}-simulator" \
            "$RUNNER_TEMP/fm_probe.swift"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # With the probe green, `canImport(FoundationModels)` is true here, so
      # this build genuinely compiles FoundationWorkoutParser and the FM side
      # of the orchestrator — catching symbol drift the macos-14 job can't see.
      - name: Build with the FM branch compiled in
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme WorkoutChatLog \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_ARCHS=x86_64
