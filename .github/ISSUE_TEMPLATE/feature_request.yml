name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome as issues. Note this repo is source-available and
        doesn't accept unsolicited feature PRs — see
        [CONTRIBUTING](../../CONTRIBUTING.md). Open an issue first so we can
        agree on the approach.
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you like to see, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
  - type: checkboxes
    id: doctrine
    attributes:
      label: Fits the app's local-first doctrine
      options:
        - label: This works on-device, without accounts, servers, tracking, or making the data leave the phone.
          required: false
