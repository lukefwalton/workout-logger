name: Bug report
description: Something in the app or widget isn't working right.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in what you can — it all helps.

        **Issues are public.** Please don't post personal health or workout data,
        and redact anything private from screenshots, HealthKit, or exported
        files before attaching them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Log/tap …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Logging / parsing a workout
        - History or Progress charts
        - Exercise library (search / rename / merge)
        - Import / export
        - HealthKit
        - The Home Screen widget
        - Somewhere else / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS version, device & app version
      placeholder: "e.g. iOS 17.5, iPhone 14, app v1.1"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the shorthand you typed, or other context (redact personal health/workout details — issues are public).
    validations:
      required: false
